<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Super Mint — Atomic Multi-Chain Mint Engine, by RAHAT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071311"/>
      <stop offset="45%" stop-color="#0a1f1b"/>
      <stop offset="100%" stop-color="#04100f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6ffe2"/>
      <stop offset="30%" stop-color="#7dffc4"/>
      <stop offset="65%" stop-color="#2ee6a8"/>
      <stop offset="100%" stop-color="#22b8a0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ee6a8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2ee6a8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#7dffc4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2ee6a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#2ee6a8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2ee6a8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#2ee6a8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M80 0V340M240 0V340M400 0V340M560 0V340M720 0V340M880 0V340M1040 0V340M1200 0V340"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Cascadia Code','Consolas','DejaVu Sans Mono',monospace" font-weight="700" letter-spacing="6">
    <text x="640" y="150" text-anchor="middle" font-size="86" fill="url(#mint)" filter="url(#soft)">SUPER MINT</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="339" rx="16" fill="none" stroke="#1d6f5f" stroke-opacity="0.7"/>

  <text x="640" y="196" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="17" letter-spacing="5" fill="#9fb9b2">ATOMIC MULTI-CHAIN MINT ENGINE</text>

  <rect x="180" y="216" width="920" height="2" fill="url(#line)"/>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="15" letter-spacing="3">
    <text x="470" y="258" text-anchor="middle" fill="#2ee6a8">5 WALLETS</text>
    <text x="640" y="258" text-anchor="middle" fill="#22b8a0">4 CHAINS</text>
    <text x="810" y="258" text-anchor="middle" fill="#2ee6a8">0 ms SIGNING</text>
  </g>

  <text x="640" y="306" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="14" letter-spacing="6" fill="#e7c66b">by RAHAT</text>

  <g fill="#2ee6a8">
    <circle cx="16" cy="16" r="4" fill-opacity="0.55"/>
    <circle cx="1264" cy="324" r="4" fill-opacity="0.55"/>
  </g>
</svg>